services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/crm
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-me-32b-minimum!!
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
