databaseChangeLog:
  - changeSet:
      id: 003-create-guest
      author: kirill
      changes:
        - createTable:
            tableName: guest
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: passport
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: photo
                  type: varchar(500)
              - column:
                  name: birth_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: check_in_date
                  type: date
              - column:
                  name: check_out_date
                  type: date
              - column:
                  name: apartment_id
                  type: bigint
        - addForeignKeyConstraint:
            constraintName: fk_guest_apartment
            baseTableName: guest
            baseColumnNames: apartment_id
            referencedTableName: apartment
            referencedColumnNames: id