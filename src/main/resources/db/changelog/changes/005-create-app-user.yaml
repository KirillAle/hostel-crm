databaseChangeLog:
  - changeSet:
      id: 005-create-app-user
      author: kirill
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: bigint
        - addForeignKeyConstraint:
            constraintName: fk_app_user_role
            baseTableName: app_user
            baseColumnNames: role_id
            referencedTableName: role
            referencedColumnNames: id
